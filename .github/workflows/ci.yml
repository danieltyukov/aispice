name: CI

# Standard GitHub-hosted runners throughout: Actions minutes are free and
# unmetered on a public repository with standard runners, and a larger runner
# bills even there, so `runs-on` never names one.

# Pushes to master and every pull request. A branch with no pull request can be
# run from the Actions tab, which is what workflow_dispatch is for; running on
# every branch push as well would run each pull request twice.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same ref cancels the first; only the last commit's
# result matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The engine crates have no Tauri dependency and no system libraries,
      # so this job needs no WebKitGTK and runs on all three systems.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-engine-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-engine-${{ matrix.os }}-

      # ngspice makes the simulator tests real rather than skipped. Tests that
      # need a simulator check for it at run time, so Windows, where there is
      # no packaged ngspice, still runs everything else. strace lets the
      # include differential test see every file ngspice opens.
      - name: Install ngspice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ngspice strace

      - name: Install ngspice (macOS)
        if: runner.os == 'macOS'
        run: brew install ngspice

      # Both sandboxes for real: bubblewrap, with Ubuntu's restriction on
      # unprivileged user namespaces lifted (aispice changes no system
      # setting itself; this runner is throwaway), and Landlock at the
      # kernel's ABI. The sandbox tests fail rather than skip when either is
      # missing here.
      - name: Sandboxes (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          uname -r
          echo "AISPICE_REQUIRE_SANDBOXES=bwrap,landlock" >> "$GITHUB_ENV"

      # The whole workspace, app shell included: formatting needs no compiling.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --no-fail-fast

  # The IC path against the real IHP SG13G2 PDK, fetched at a pinned commit
  # (only its ngspice models, Verilog-A sources, KLayout decks and pcells;
  # nothing is committed) with its OSDI models compiled by OpenVAF. Not a
  # required check: it depends on three downloads. Xyce is not built here, so
  # the Xyce half of these tests skips; it runs where a plugin-capable Xyce is
  # installed. Magic is not installed either (Ubuntu's is older than IHP's
  # tech file needs), so extraction runs locally. The runner is pinned to
  # 24.04 because the KLayout package is built for it.
  pdk:
    name: PDK (IHP SG13G2)
    runs-on: ubuntu-24.04
    env:
      IHP_PDK_COMMIT: 22f2a25f1734796de3debbbf29cf697cbbc54081
      OPENVAF_URL: https://openva.fra1.cdn.digitaloceanspaces.com/openvaf_23_5_0_linux_amd64.tar.gz
      OPENVAF_SHA256: 79c0e08ad948a7a9f460dc87be88b261bbd99b63a4038db3c64680189f44e4f0
      KLAYOUT_URL: https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.4-1_amd64.deb
      KLAYOUT_SHA256: a25e750329921de81ea35f349194768fc925f5d1aacbacffc1856af733a7be25
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-pdk-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-pdk-

      # Verilator builds the co-simulated Verilog of the mixed-signal tests;
      # g++ and make are on the runner already.
      - name: Install ngspice and Verilator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ngspice verilator

      # As in the engine job: both sandboxes, so ngspice with the PDK's OSDI
      # models is run under the native-code profile in each.
      - name: Sandboxes
        run: |
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "AISPICE_REQUIRE_SANDBOXES=bwrap,landlock" >> "$GITHUB_ENV"

      # Only the PDK's sources are cached. The OSDI models are compiled on every
      # run instead: OpenVAF builds for the runner's own CPU, a cache restored on
      # another runner then holds code that stops ngspice before it writes any
      # results, and OpenVAF 23.5.0 crashes on the runners when asked for a
      # generic CPU. Compiling takes seconds.
      - name: Cache the PDK sources
        id: pdk-cache
        uses: actions/cache@v6
        with:
          path: ~/pdk
          key: ihp-sg13g2-${{ env.IHP_PDK_COMMIT }}-sources-klayout

      - name: Fetch IHP-Open-PDK at the pinned commit
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        run: |
          git init -q ~/pdk/IHP-Open-PDK
          cd ~/pdk/IHP-Open-PDK
          git remote add origin https://github.com/IHP-GmbH/IHP-Open-PDK.git
          git sparse-checkout set --no-cone /.gitmodules \
            /ihp-sg13g2/libs.tech/ngspice/ /ihp-sg13g2/libs.tech/verilog-a/ \
            /ihp-sg13g2/libs.tech/klayout/python/ /ihp-sg13g2/libs.tech/klayout/tech/sg13g2.lyp \
            /ihp-sg13g2/libs.tech/klayout/tech/drc/ihp-sg13g2.drc /ihp-sg13g2/libs.tech/klayout/tech/drc/rule_decks/ \
            /ihp-sg13g2/libs.tech/klayout/tech/lvs/sg13g2.lvs /ihp-sg13g2/libs.tech/klayout/tech/lvs/rule_decks/
          git fetch -q --depth 1 --filter=blob:none origin "$IHP_PDK_COMMIT"
          git checkout -q FETCH_HEAD
          # The pcells import these two submodules.
          git submodule update -q --init --depth 1 -- \
            ihp-sg13g2/libs.tech/klayout/python/pycell4klayout-api \
            ihp-sg13g2/libs.tech/klayout/python/pypreprocessor

      - name: Compile the PDK's Verilog-A models to OSDI
        run: |
          curl -sSfL -o "$RUNNER_TEMP/openvaf.tar.gz" "$OPENVAF_URL"
          echo "$OPENVAF_SHA256  $RUNNER_TEMP/openvaf.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/openvaf"
          tar -xzf "$RUNNER_TEMP/openvaf.tar.gz" -C "$RUNNER_TEMP/openvaf"
          cd ~/pdk/IHP-Open-PDK/ihp-sg13g2/libs.tech/verilog-a
          rm -f ../ngspice/osdi/*.osdi
          PATH="$RUNNER_TEMP/openvaf:$PATH" ./openvaf-compile-va.sh
          ls -l ../ngspice/osdi
          # The script reports compiler crashes without failing, so check the
          # models it must produce.
          for m in psp103 psp103_nqs r3_cmc mosvar; do
            test -s "../ngspice/osdi/$m.osdi" || { echo "missing $m.osdi"; exit 1; }
          done
          # The mixed-signal tests compile Verilog-A with the same OpenVAF.
          echo "$RUNNER_TEMP/openvaf" >> "$GITHUB_PATH"

      - name: Install KLayout
        run: |
          curl -sSfL -o "$RUNNER_TEMP/klayout.deb" "$KLAYOUT_URL"
          echo "$KLAYOUT_SHA256  $RUNNER_TEMP/klayout.deb" | sha256sum -c -
          sudo apt-get install --no-install-recommends -y "$RUNNER_TEMP/klayout.deb"
          klayout -b -v

      - name: PDK tests
        run: |
          export AISPICE_PDK_IHP="$HOME/pdk/IHP-Open-PDK/ihp-sg13g2"
          cargo test -p aispice-sim --lib pdk::
          cargo test -p aispice-sim --lib sandbox::
          cargo test -p aispice-tools --test pdk_ihp -- --nocapture
          cargo test -p aispice-tools --test templates_ihp -- --nocapture
          cargo test -p aispice-tools --test eval_suite -- every_reference_solution_passes
          cargo test -p aispice-tools --test mixed_signal -- --nocapture
          cargo test -p aispice-sim --test xspice_policy -- --nocapture
          cargo test -p aispice-sim --lib native_code -- --nocapture

      # One DRC deck on a synthetic layout, then a generated current mirror
      # through DRC and LVS, the broken-layout checks, blocks with their pins
      # at the edge as macro packages have them, and the files each layout
      # tool writes on a generated OTA: about two minutes. The chip assembly
      # script is run on block files made to mislead it. Macro export and
      # chip assembly need Magic, so they run where it is installed.
      - name: Layout tests
        run: |
          export AISPICE_PDK_IHP="$HOME/pdk/IHP-Open-PDK/ihp-sg13g2"
          cargo test -p aispice-layout --test drc_ihp -- --nocapture
          cargo test -p aispice-layout --test generate_ihp -- --nocapture current_mirror missing_contact edge_pinned
          cargo test -p aispice-layout --test chip_script_ihp -- --nocapture
          cargo test -p aispice-tools --test layout_ihp -- --nocapture each_layout_tool_writes_only

  shell:
    name: Desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache the Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-shell-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-shell-

      - name: Install the WebKitGTK toolchain, ngspice and a WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb ngspice

      - run: npm ci

      - name: Clippy (shell)
        run: cargo clippy -p aispice-app --all-targets -- -D warnings

      # The real binary with the real backend, driven through WebKitWebDriver
      # under a virtual display. This is the end-to-end test that covers the
      # IPC layer the mocked interface tests cannot.
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Build the debug app with its interface embedded
        working-directory: app
        run: npx tauri build --debug --no-bundle

      # WebKitGTK's GPU paths draw nothing on Xvfb, so the webview renders in
      # software here.
      - name: Desktop end-to-end
        run: xvfb-run -a npm run test:desktop -w app
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e
          path: app/e2e-desktop/output/
          if-no-files-found: ignore
          retention-days: 7

  interface:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck -w app

      - name: Lint
        run: npm run lint -w app

      # Against the in-browser mock backend: no Rust, no simulator, no network.
      - name: Unit tests
        run: npm test -w app

      - name: Build the app
        run: npm run build -w app

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app

      - name: Playwright
        run: npm run test:e2e -w app

      - name: Build the site
        run: npm run build -w site

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
