[package]
name = "aispice-sim"
description = "Simulator backends, waveform reading, measurements and optimization for aispice."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["spice", "ngspice", "ltspice", "xyce", "simulation"]
categories = ["science", "simulation"]

[dependencies]
aispice-core.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
dirs.workspace = true
tracing.workspace = true
tempfile.workspace = true
tokio-util = "0.7"
async-trait = "0.1"

# libc is used on every Unix to read xschem's netlist without following a
# symlink and to kill a process group; Landlock and seccomp
# (backend::confine) are Linux-only.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true

[features]
# Exposes `sandbox::Sandbox::landlock_at_abi_for_tests` and
# `use_landlock_abi_for_tests`, so tests on a newer kernel can run under a
# real Landlock ruleset at an older ABI. Only dev-dependencies enable it,
# this crate's own included (for its integration tests); CI checks that no
# normal dependency path of a shipped binary does.
testing = []

[dev-dependencies]
aispice-core = { workspace = true, features = ["testing"] }
aispice-sim = { workspace = true, features = ["testing"] }

[lints]
workspace = true
