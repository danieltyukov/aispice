[package]
name = "aispice-core"
description = "Schematic, symbol and netlist engine for aispice: lossless LTspice .asc/.asy I/O, netlisting, rendering, editing and checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["spice", "ltspice", "schematic", "netlist", "eda"]
categories = ["science", "parser-implementations"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
similar.workspace = true
resvg = { workspace = true, optional = true }
# Macro packages (macropkg): macro.toml, pattern checks, evidence hashes.
regex = "1"
sha2 = "0.10"
toml = "1"

[features]
default = ["raster"]
# PNG output for multimodal models, through resvg. Off for builds that only
# need SVG.
raster = ["dep:resvg"]
# Exposes `xschem::export::SchText::trusted_for_tests`, so other crates' tests
# can hand xschem text that is not an export (IHP's own test benches). Never
# on in a product build.
testing = []

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[[example]]
name = "render_gallery"
required-features = ["raster"]

[lints]
workspace = true
