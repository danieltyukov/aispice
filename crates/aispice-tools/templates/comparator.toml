id = "comparator"
title = "StrongARM latch comparator (IHP SG13G2)"
category = "ic"
pdk = "ihp-sg13g2"
description = "Clocked StrongARM latch on IHP SG13G2 low-voltage devices. While clk is low, M7-M10 precharge both outputs to the supply; when it rises, the input pair M1-M2 on the clocked tail M0 discharges xp and xn at rates set by the inputs, and the cross-coupled latch M3-M6 regenerates the difference to full logic levels. The test bench clocks it at 500 MHz with inputs 1 mV apart at 0.7 V that swap between the two decisions, into 5 fF on each output. It decides correctly both ways and outn falls through half the supply within 250 ps at every process corner from -40 C to 125 C (about 135 ps at 27 C)."
analysis = ".tran 1p 3n"
corners = { process = ["tt", "ss", "ff", "sf", "fs"], temperatures = [-40, 27, 125] }
simulators = ["ngspice", "xyce"]
specs = """
first = value_at(V(outp,outn), 0.95n) >= 1
second = value_at(V(outp,outn), 2.95n) <= -1
reset = value_at(V(outp), 1.95n) >= 1.1
tdec = crossing(V(outn), 0.6, fall) <= 250p
"""

[layout]
generator = "comparator"
roles = { tail = "M0", pair = ["M1", "M2"], latch_n = ["M3", "M4"], latch_p = ["M5", "M6"], reset = ["M7", "M8", "M9", "M10"] }

[[parameters]]
part = "M1"
controls = "The input pair's width (with M2 kept equal): the initial imbalance current, so decision time and input-referred noise and offset"
equation = "regeneration starts sooner with more gm1 (Vin_diff) / Cx; offset and noise fall as 1 / sqrt(W1 L1)"

[[parameters]]
part = "M0"
controls = "The clocked tail's width: the current the pair works with during evaluation"
equation = "faster discharge of xp and xn with more tail current; the clock must drive its gate"

[[parameters]]
part = "M3"
controls = "The latch NMOS (with M4) and PMOS (M5, M6): their transconductance against the output load sets the regeneration time constant"
equation = "tau = C_out / (gm_n + gm_p) of the latch; t_decide grows as tau ln(VDD / Vin_diff)"

[[parameters]]
part = "M7"
controls = "The reset switches (M7-M10): wide enough to precharge in half a clock period, small enough to load the outputs lightly"
equation = "precharge time about R_on C_out a few times over"
