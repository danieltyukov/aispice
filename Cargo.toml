[workspace]
resolver = "3"
members = [
    "crates/aispice-core",
    "crates/aispice-sim",
    "crates/aispice-layout",
    "crates/aispice-agent",
    "crates/aispice-tools",
    "crates/aispice-cli",
    "app/src-tauri",
]
default-members = [
    "crates/aispice-core",
    "crates/aispice-sim",
    "crates/aispice-layout",
    "crates/aispice-agent",
    "crates/aispice-tools",
    "crates/aispice-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Daniel Tyukov"]
repository = "https://github.com/danieltyukov/aispice"
homepage = "https://danieltyukov.github.io/aispice/"

[workspace.dependencies]
aispice-core = { path = "crates/aispice-core", version = "0.2.0" }
aispice-sim = { path = "crates/aispice-sim", version = "0.2.0" }
aispice-layout = { path = "crates/aispice-layout", version = "0.2.0" }
aispice-agent = { path = "crates/aispice-agent", version = "0.2.0" }
aispice-tools = { path = "crates/aispice-tools", version = "0.2.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "io-std", "time", "sync"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
clap = { version = "4", features = ["derive", "env"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
similar = "3"
keyring = "4"
tempfile = "3"
dirs = "7"
libc = "0.2"
landlock = "0.4"
base64 = "0.23"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
insta = { version = "1", features = ["yaml"] }
assert_cmd = "2"
predicates = "3"

# Unsafe is denied, not forbidden: the Landlock sandbox that confines xschem
# (aispice-sim::backend::confine) needs a pre_exec hook and a few raw syscalls,
# behind a scoped `#[allow(unsafe_code)]` with its own safety notes. Nothing
# else in the workspace may reach for unsafe without the same explicit opt-in.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
